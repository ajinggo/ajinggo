<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Haiyan 的工具间</title>
<desc id="desc">银白与冰蓝色的液态玻璃封面。算算持仓成本，记记信用卡账单。</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset=".55" stop-color="#edf2f8"/><stop offset="1" stop-color="#dfe8f4"/></linearGradient>
 <radialGradient id="orb" cx=".3" cy=".2" r=".9"><stop stop-color="#fff"/><stop offset=".28" stop-color="#d9eaff"/><stop offset=".59" stop-color="#8db7ee"/><stop offset=".8" stop-color="#c8dcf4"/><stop offset="1" stop-color="#eef5ff"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff" stop-opacity=".84"/><stop offset=".46" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#e9f2ff" stop-opacity=".56"/></linearGradient>
 <linearGradient id="edge" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".4" stop-color="#fff" stop-opacity=".9"/><stop offset=".7" stop-color="#a4b9d4" stop-opacity=".35"/><stop offset="1" stop-color="#fff"/></linearGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".23" stop-color="#d9e5f3"/><stop offset=".4" stop-color="#fff"/><stop offset=".57" stop-color="#8fa8c6"/><stop offset=".72" stop-color="#eaf4ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#59769b" flood-opacity=".17"/></filter>
 <filter id="softshadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#56759e" flood-opacity=".18"/></filter>
 <clipPath id="clip"><rect x="1" y="1" width="1198" height="438" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="440" fill="url(#bg)"/>
 <ellipse cx="1030" cy="55" rx="240" ry="150" fill="#fff" opacity=".8" filter="url(#blur)"/>
 <ellipse cx="885" cy="310" rx="150" ry="95" fill="#a8cbf8" opacity=".48" filter="url(#blur)"/>
 <ellipse cx="550" cy="460" rx="320" ry="95" fill="#fff" opacity=".7" filter="url(#blur)"/>
 <circle cx="954" cy="191" r="119" fill="url(#orb)" filter="url(#softshadow)"/>
 <ellipse cx="923" cy="126" rx="60" ry="26" transform="rotate(-29 923 126)" fill="#fff" opacity=".65" filter="url(#blur)"/>
 <g transform="translate(760 118) rotate(-9 150 110)" filter="url(#shadow)">
  <rect width="310" height="218" rx="30" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="7" y="7" width="296" height="204" rx="24" fill="none" stroke="#fff" stroke-opacity=".38"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#344e6d">
   <text x="28" y="46" font-size="12" letter-spacing="1.5">COSTBUDDY</text>
   <text x="28" y="89" font-size="27" font-weight="600" letter-spacing="-.5">A clearer picture.</text>
  </g>
  <path d="M29 127h252M29 177h252" stroke="#8da8cd" stroke-opacity=".19"/>
  <path d="m30 160 46 10 48-24 48 8 51-31 53 4" fill="none" stroke="#6b91c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="276" cy="127" r="5" fill="#fff" stroke="#6b91c7" stroke-width="2"/>
 </g>
 <g transform="translate(1000 265) rotate(12 68 55)" filter="url(#softshadow)">
  <rect width="139" height="110" rx="26" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
  <g fill="none" stroke="#637d9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m25 31 4 4 8-9m-12 29 4 4 8-9m-12 29 4 4 8-9"/><path d="M50 31h62M50 55h44M50 79h55" opacity=".65"/></g>
 </g>
 <circle cx="797" cy="348" r="24" fill="none" stroke="url(#chrome)" stroke-width="12" filter="url(#softshadow)"/>
 <circle cx="1102" cy="102" r="17" fill="url(#orb)" stroke="#fff" stroke-opacity=".8"/>
 <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <text x="64" y="78" font-size="14" fill="#6d7b8e" letter-spacing="2.5">HAIYAN / PERSONAL PROJECTS</text>
  <text x="60" y="164" font-size="62" font-weight="650" fill="#25354b" letter-spacing="-2">Haiyan 的工具间</text>
  <text x="64" y="234" font-size="31" fill="#4b607b">算算持仓成本，</text>
  <text x="64" y="280" font-size="31" fill="#4b607b">记记信用卡账单。</text>
  <g transform="translate(64 342)">
   <rect width="128" height="36" rx="18" fill="#fff" fill-opacity=".54" stroke="#fff" stroke-opacity=".9"/>
   <text x="64" y="23" text-anchor="middle" font-size="12" fill="#586e8a">CostBuddy</text>
   <rect x="139" width="154" height="36" rx="18" fill="#fff" fill-opacity=".54" stroke="#fff" stroke-opacity=".9"/>
   <text x="216" y="23" text-anchor="middle" font-size="12" fill="#586e8a">Credit Card Ledger</text>
  </g>
 </g>
</g>
<rect x="1" y="1" width="1198" height="438" rx="28" fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".9"/>
</svg>
