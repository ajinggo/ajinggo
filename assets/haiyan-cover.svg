  <rect x="6" y="6" width="286" height="146" rx="24" fill="none" stroke="#fff" stroke-opacity=".55"/>
  <text x="26" y="40" font-family="-apple-system,sans-serif" font-size="13" letter-spacing="1" fill="#4f6481">CostBuddy</text>
  <path d="M26 75h245M26 119h245" stroke="#7c99c0" opacity=".14"/>
  <path d="m27 109 39 7 43-19 38 6 52-32 68 8" fill="none" stroke="#6d8fbf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
