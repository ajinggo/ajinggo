 <circle cx="1096" cy="316" r="31" fill="url(#pearl)" stroke="#fff" stroke-opacity=".8" filter="url(#softshadow)"/>
 <circle cx="790" cy="95" r="12" fill="url(#pearl)" stroke="#fff" stroke-opacity=".9"/>
 <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <text x="64" y="80" font-size="12" fill="#6d7b8e" letter-spacing="2.5">PERSONAL PROJECTS</text>
  <text x="60" y="164" font-size="64" font-weight="650" fill="#25354b" letter-spacing="-2">Haiyan / ajinggo</text>
  <text x="64" y="236" font-size="25" fill="#4b607b">持仓成本计算器</text>
