  <ellipse rx="96" ry="86" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>
  <path d="M-157-35C-140-128-30-182 65-136" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".75"/>
 </g>
 <g transform="translate(751 188) rotate(-7 149 79)" filter="url(#shadow)">
