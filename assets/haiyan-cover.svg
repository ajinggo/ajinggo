<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Haiyan / ajinggo</title>
<desc id="desc">Haiyan / ajinggo。银白液态玻璃封面，展示持仓成本计算器与信用卡账本。</desc>
<defs>
 <linearGradient id="ribbon" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#fefefe"/><stop offset=".2" stop-color="#c5d4e9"/><stop offset=".34" stop-color="#fbfdff"/><stop offset=".43" stop-color="#869cba"/><stop offset=".49" stop-color="#e9f3ff"/><stop offset=".63" stop-color="#c5d9f1"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#93a9c7"/></linearGradient>
