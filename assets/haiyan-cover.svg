 <ellipse cx="885" cy="310" rx="150" ry="95" fill="#a8cbf8" opacity=".48" filter="url(#blur)"/>
 <ellipse cx="550" cy="460" rx="320" ry="95" fill="#fff" opacity=".7" filter="url(#blur)"/>
